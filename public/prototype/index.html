<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج انتشار</title>
<meta name="description" content="نموذج تفاعلي لتطبيق المتسوق ومحرر التاجر في منصة انتشار">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-bg:#f4f3ef; --c-panel:#ffffff; --c-text:#1b1b1a; --c-muted:#6b6a66; --c-line:#e3e1db;
  --c-brand:#0f766e; --c-brand-soft:#e3f2ef; --c-warn:#b45309; --c-warn-soft:#fdf2e3; --c-ok:#15803d;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#151615; --c-panel:#1f201f; --c-text:#ecebe7; --c-muted:#a3a19b; --c-line:#33342f;
    --c-brand:#2dd4bf; --c-brand-soft:#123b37; --c-warn:#f59e0b; --c-warn-soft:#3a2a10; --c-ok:#4ade80;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);letter-spacing:0;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
bdi{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- prototype chrome ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--c-panel);border-bottom:1px solid var(--c-line)}
.logo{font-weight:700;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--c-brand);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #fff}
.logo small{font-weight:400;color:var(--c-muted)}
.seg{display:inline-flex;background:var(--c-bg);border:1px solid var(--c-line);border-radius:10px;padding:3px}
.seg button{padding:5px 14px;border-radius:7px;font-size:14px;color:var(--c-muted);white-space:nowrap}
.seg button.on{background:var(--c-panel);color:var(--c-text);box-shadow:var(--shadow);font-weight:600}
.spacer{flex:1}
.note{font-size:12px;color:var(--c-muted)}
.note a{color:var(--c-brand)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1px solid var(--c-line);background:var(--c-panel);font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--c-brand)}
.btn.primary{background:var(--c-brand);border-color:var(--c-brand);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{padding:7px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--c-brand-soft);color:var(--c-brand);white-space:nowrap}
.pill.warn{background:var(--c-warn-soft);color:var(--c-warn)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- shopper tab layout ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px minmax(0,1fr);gap:24px;padding:20px 16px 40px;max-width:1300px;margin:0 auto;align-items:start}
.stage .left,.stage .right{min-width:0}
@media (max-width:1100px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center}.phone-wrap{width:100%;min-width:0}.stage .left,.stage .right{width:100%;max-width:520px}}
.card{background:var(--c-panel);border:1px solid var(--c-line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:13px;padding:4px 11px;border:1px solid var(--c-line);border-radius:99px;background:var(--c-panel)}
.chips button.on{border-color:var(--c-brand);color:var(--c-brand);background:var(--c-brand-soft);font-weight:600}
.notes{margin:0;padding:0;list-style:none;font-size:13.5px}
.notes li{padding:7px 0;border-bottom:1px dashed var(--c-line)}
.notes li:last-child{border:0}
.notes code{font-size:11px;background:var(--c-bg);padding:1px 6px;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.field{display:grid;gap:5px;margin-bottom:12px}
.field>label,.field>.lbl{font-size:13px;color:var(--c-muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:7px 10px;border:1px solid var(--c-line);border-radius:8px;background:var(--c-panel)}
.field textarea{min-height:70px;resize:vertical}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:10px}
.switch input{width:38px;height:22px;appearance:none;background:var(--c-line);border-radius:99px;position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--c-brand)}
.switch input:checked::after{right:19px}

/* ---------- phone ---------- */
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.phone{--p:#7a5c2e;--on-p:#fff;--acc:#c9a14a;--bg:#fbf8f3;--surf:#fff;--text:#1d1a16;--muted:#7a746b;--border:#ece6dc;--r:14px;--font:'IBM Plex Sans Arabic';
  width:min(390px,100%);height:790px;border-radius:44px;border:10px solid #111;background:var(--bg);color:var(--text);font-family:var(--font),'IBM Plex Sans Arabic',sans-serif;
  position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.phone.mini{width:300px;height:620px;border-width:8px;border-radius:36px}
.status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;direction:ltr}
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 10px}
.appbar .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surf);border:1px solid var(--border);position:relative}
.badge{position:absolute;top:-3px;left:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--p);color:var(--on-p);font-size:11px;display:grid;place-items:center;padding:0 4px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.content::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--surf);padding:6px 4px 16px}
.tabbar button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tabbar button.on{color:var(--p);font-weight:600}
.tabbar.pill-style{margin:0 12px 14px;border:1px solid var(--border);border-radius:24px;padding:8px 4px}
.tabbar .badge{top:-4px;left:calc(50% - 22px)}
.sec{padding:14px 14px 4px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h4{margin:0;font-size:16px}
.sec-h button{font-size:13px;color:var(--p)}
.block{position:relative}
.block.sel{outline:2px solid #2563eb;outline-offset:-2px;border-radius:6px}
.block.hover:hover{outline:2px dashed #93c5fd;outline-offset:-2px;cursor:pointer}
.block-tag{position:absolute;top:4px;right:4px;z-index:3;background:#2563eb;color:#fff;font-size:11px;padding:1px 8px;border-radius:6px}
.ann{padding:8px 14px;text-align:center;font-size:13px;font-weight:500}
.ann.primary{background:var(--p);color:var(--on-p)}
.ann.accent{background:var(--acc);color:#1b1b1b}
.ann.dark{background:#1b1b1b;color:#fff}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:4px 14px 0;scrollbar-width:none}
.hero::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:var(--r);overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:16px;color:#fff}
.slide .art{position:absolute;inset-inline-start:auto;inset-inline-end:8px;bottom:0;width:46%;opacity:.95}
.slide .txt{position:relative;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0));padding:6px 4px;border-radius:8px}
.slide b{display:block;font-size:20px}
.slide span{font-size:13px;opacity:.95}
.slide .cta{display:inline-block;margin-top:8px;background:#fff;color:#111;font-size:12px;padding:4px 12px;border-radius:99px;font-weight:600}
.dots{display:flex;justify-content:center;gap:5px;padding:8px 0 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--border)}
.dots i.on{width:16px;background:var(--p)}
.cats{display:flex;gap:12px;overflow-x:auto;padding:4px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:grid;justify-items:center;gap:5px;font-size:12px;width:64px;text-align:center}
.cat .ci{width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid var(--surf);box-shadow:0 0 0 1px var(--border)}
.cats.cards .cat{width:84px}
.cats.cards .ci{width:84px;height:70px;border-radius:calc(var(--r) - 4px)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pc{flex:0 0 148px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px;padding:0 14px 6px}
.pc{background:var(--surf);border-radius:var(--r);overflow:hidden;position:relative;display:flex;flex-direction:column;text-align:start;cursor:pointer}
.pc.bordered{border:1px solid var(--border)}
.pc.light{background:transparent}
.pc .im{aspect-ratio:1/1;position:relative;overflow:hidden;border-radius:var(--r)}
.pc.classic .im,.pc.bordered .im{border-radius:0}
.pc .im svg{width:100%;height:100%;display:block}
.pc .info{padding:8px 9px 10px;display:grid;gap:2px}
.pc.light .info{padding:7px 2px}
.pc .nm{font-size:13px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;line-height:1.45}
.pc .pr{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pc .was{font-size:11.5px;color:var(--muted);text-decoration:line-through;font-weight:400}
.pc .heart{position:absolute;top:7px;left:7px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#333;z-index:2}
.pc .heart.on{color:#e11d48}
.pc .tag{position:absolute;top:8px;right:8px;z-index:2;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--p);color:var(--on-p)}
.pc .tag.low{background:#b45309;color:#fff}
.pc .tag.oos{background:#555;color:#fff}
.pc.oos .im{opacity:.55}
.pc .notify{margin-top:6px;font-size:12px;border:1px solid var(--p);color:var(--p);border-radius:8px;padding:4px}
.pc.horizontal{flex-direction:row;align-items:center}
.pc.horizontal .im{width:42%;flex:none}
.hscroll .pc.horizontal{flex-basis:250px}
.banners{display:grid;gap:10px;padding:0 14px}
.banners.two{grid-template-columns:1fr 1fr}
.banners.feature{grid-template-columns:1fr 1fr}
.banners.feature .bn:first-child{grid-column:1/-1;aspect-ratio:2.2/1}
.bn{border-radius:var(--r);aspect-ratio:1.2/1;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:10px;font-weight:700}
.banners.one .bn{aspect-ratio:2.4/1}
.bn svg{position:absolute;inset-inline-end:4px;bottom:0;height:85%;width:auto}
.bn span{position:relative;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.cd{margin:4px 14px;border-radius:var(--r);background:var(--surf);border:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}
.cd .t{flex:1}
.cd .t b{display:block}
.cd .t small{color:var(--muted)}
.cd .clock{direction:ltr;font-variant-numeric:tabular-nums;font-weight:700;background:var(--p);color:var(--on-p);border-radius:8px;padding:5px 9px;font-size:15px}
.excl{font-size:10.5px;background:var(--acc);color:#1b1b1b;border-radius:5px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 14px 14px}
.trust div{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--surf);border:1px solid var(--border);border-radius:calc(var(--r) - 4px);padding:9px}
.trust svg{color:var(--p);flex:none}
.rt{padding:6px 18px;font-size:14px;color:var(--muted)}
.linked{position:absolute;top:6px;left:20px;z-index:3;font-size:10.5px;background:#111;color:#fff;border-radius:6px;padding:1px 7px;opacity:.85}
.brands{display:flex;gap:10px;overflow-x:auto;padding:4px 14px;scrollbar-width:none}
.brands span{flex:none;border:1px solid var(--border);background:var(--surf);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px}

/* screens */
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bar-chips{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.bar-chips::-webkit-scrollbar{display:none}
.bar-chips button{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);background:var(--surf);border-radius:99px;padding:5px 12px}
.bar-chips button.on{background:var(--p);color:var(--on-p);border-color:var(--p)}
.applied{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.applied span{font-size:12px;background:var(--surf);border:1px solid var(--p);color:var(--p);border-radius:99px;padding:2px 10px;display:inline-flex;gap:4px;align-items:center}
.list-note{font-size:12px;color:var(--muted);padding:0 14px 8px}
.oos-sep{margin:14px 14px 8px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.oos-sep::before,.oos-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surf);width:100%;border-radius:22px 22px 0 0;padding:10px 16px 18px;max-height:82%;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 10px}
.sheet h5{margin:14px 0 8px;font-size:14px}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{font-size:13px;border:1px solid var(--border);border-radius:10px;padding:6px 12px;background:var(--bg)}
.opt button.on{border-color:var(--p);color:var(--p);font-weight:600;background:var(--surf)}
.opt button[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.opt small{color:var(--muted);margin-inline-start:3px}
.cta-btn{width:100%;background:var(--p);color:var(--on-p);border-radius:calc(var(--r) - 2px);padding:12px;font-weight:700;font-size:15px;display:flex;justify-content:center;gap:8px}
.cta-btn.ghost{background:transparent;color:var(--p);border:1px solid var(--p)}
.search-box{display:flex;gap:8px;padding:0 14px 10px}
.search-box input{flex:1;border:1px solid var(--border);background:var(--surf);border-radius:12px;padding:9px 12px;outline:none}
.search-box input:focus{border-color:var(--p)}
.search-box button{background:var(--p);color:var(--on-p);border-radius:12px;padding:0 14px;font-weight:600}
.hist{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
.hist button{font-size:12.5px;border:1px solid var(--border);border-radius:99px;padding:3px 11px;background:var(--surf);display:inline-flex;gap:5px;align-items:center}
.res{display:grid;gap:2px;padding:4px 14px}
.res button{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);text-align:start}
.res .th{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none}
.gal{position:relative}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .track>div{flex:0 0 100%;aspect-ratio:1/1;scroll-snap-align:center}
.gal .track svg{width:100%;height:100%;display:block}
.gal .thumbs{display:flex;gap:6px;justify-content:center;padding:8px}
.gal .thumbs i{width:38px;height:38px;border-radius:8px;overflow:hidden;border:2px solid transparent;display:block}
.gal .thumbs i.on{border-color:var(--p)}
.gal .thumbs svg{width:100%;height:100%;display:block}
.gal .float{position:absolute;top:10px;display:flex;gap:8px;inset-inline:12px;justify-content:space-between}
.gal .float button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#222}
.zoomhint{position:absolute;bottom:56px;left:12px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 7px}
.pdp h2{margin:0 0 2px;font-size:19px}
.stars{color:#f59e0b;font-size:13px;display:flex;align-items:center;gap:4px}
.stars span{color:var(--muted)}
.bigprice{font-size:22px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bigprice .was{font-size:14px;color:var(--muted);text-decoration:line-through;font-weight:400}
.bigprice .off{font-size:12px;background:#dc2626;color:#fff;border-radius:6px;padding:0 6px}
.bnpl{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:13px;background:var(--surf)}
.bnpl b.tabby{background:#3bffc1;color:#000;border-radius:5px;padding:0 6px;font-size:12px;direction:ltr}
.bnpl b.tamara{background:linear-gradient(90deg,#f9c9a8,#d6a6f4);color:#000;border-radius:5px;padding:0 6px;font-size:12px;direction:ltr}
.info-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.info-line svg{color:var(--p);flex:none;margin-top:2px}
.sticky{position:sticky;bottom:0;background:var(--surf);border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:5}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surf)}
.stepper button{width:32px;height:34px;display:grid;place-items:center}
.stepper span{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.ci-row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.ci-row .th{width:76px;height:76px;border-radius:12px;overflow:hidden;flex:none}
.ci-row .th svg{width:100%;height:100%}
.ship{margin:12px 14px;background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13px}
.prog{height:6px;border-radius:3px;background:var(--border);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);border-radius:3px}
.coupon{display:flex;gap:8px;margin:0 14px 10px}
.coupon input{flex:1;border:1px solid var(--border);background:var(--surf);border-radius:10px;padding:8px 10px;outline:none}
.coupon button{border:1px solid var(--p);color:var(--p);border-radius:10px;padding:0 14px;font-weight:600}
.totals{margin:0 14px 12px;background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:6px 12px}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.totals div.sum{border-top:1px solid var(--border);font-weight:700;font-size:15px;margin-top:4px;padding-top:10px}
.web{background:#f3f4f6;color:#111827;min-height:100%;font-family:system-ui,'IBM Plex Sans Arabic',sans-serif}
.web .wbar{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:#4b5563;padding:6px;background:#e5e7eb;direction:ltr}
.web .wsec{background:#fff;margin:10px;border-radius:10px;padding:12px;border:1px solid #e5e7eb}
.web h6{margin:0 0 8px;font-size:14px}

const hex2rgb = h => { h = h.replace('#',''); if (h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
const rgb2hex = a => '#' + a.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix = (a, b, t) => { const x=hex2rgb(a), y=hex2rgb(b); return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t)); };

function pick(source, count) {

  else if (source === 'sale') l = l.filter(p => p.sale);
  else if (source && source.startsWith('cat:')) l = l.filter(p => p.cat === source.slice(4));

/* ---------- diff / publish / history ---------- */
function diff() {
  const a = S.published, b = S.draft, out = [];
  const nm = x => BLOCKS[x.type].name + (x.props.title ? ` «${x.props.title}»` : '');
  const aIds = a.blocks.map(x => x.id), bIds = b.blocks.map(x => x.id);
  b.blocks.forEach(x => { if (!aIds.includes(x.id)) out.push(['add', 'إضافة', nm(x)]); });
  a.blocks.forEach(x => { if (!bIds.includes(x.id)) out.push(['del', 'حذف', nm(x)]); });
  b.blocks.forEach(x => {
    const o = a.blocks.find(y => y.id === x.id); if (!o) return;
    if (JSON.stringify(o.props) !== JSON.stringify(x.props)) out.push(['mod', 'تعديل', nm(x)]);
    if (!!o.hidden !== !!x.hidden) out.push(['mod', x.hidden ? 'إخفاء' : 'إظهار', nm(x)]);
  });
  const common = bIds.filter(id => aIds.includes(id)), aOrder = aIds.filter(id => bIds.includes(id));
  if (common.join() !== aOrder.join()) out.push(['mov', 'ترتيب', 'تغيّر ترتيب الأقسام']);
  const keys = {primary: 'اللون الرئيسي', accent: 'اللون الثانوي', font: 'الخط', radius: 'الزوايا', card: 'بطاقة المنتج', tab: 'الشريط السفلي', preset: 'الهوية الجاهزة'};
  const lab = (k, v) => ({card: {classic: 'كلاسيكي', bordered: 'بإطار', light: 'خفيف'}, tab: {line: 'خط', pill: 'عائم'}, radius: {0: 'حادة', 8: 'خفيفة', 12: 'متوسطة', 14: 'متوسطة', 16: 'متوسطة', 20: 'دائرية'}, preset: Object.fromEntries(Object.entries(PRESETS).map(([x, y]) => [x, y.name]))}[k]?.[v] ?? v);
  Object.entries(keys).forEach(([k, l]) => { if (a.brand[k] !== b.brand[k]) out.push(['mod', 'الهوية', `${l}: ${lab(k, a.brand[k])} ← ${lab(k, b.brand[k])}`]); });
  return out;
}
function modal() {
  if (S.modal === 'catalog') return `<div class="modal-bg" data-act="modal-close"><div class="modal" data-act="noop"><h2>أضف قسمًا</h2><p class="note">يُضاف تحت القسم المحدد</p><div class="catalog">${Object.entries(BLOCKS).map(([k, m]) => `<button data-act="add-block:${k}"><span style="color:var(--c-brand)">${ic(m.ico, 20)}</span><b>${m.name}</b><small>${m.desc}</small></button>`).join('')}</div></div></div>`;
  if (S.modal === 'publish') {
    const d = diff();
    return `<div class="modal-bg" data-act="modal-close"><div class="modal" data-act="noop"><h2>مراجعة التعديلات قبل النشر</h2><p class="note">من الإصدار ${S.published.version} إلى ${S.published.version + 1}. يظهر التحديث في تطبيقات العملاء عند تنقلهم التالي، دون إصدار جديد من المتجر.</p>
      <ul class="diff">${d.map(x => `<li><span class="k ${x[0]}">${x[1]}</span><span>${esc(x[2])}</span></li>`).join('')}</ul>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="publish">نشر الآن</button><button class="btn" disabled title="المرحلة الثانية">جدولة <span class="pill">لاحقًا</span></button><span class="spacer"></span><button class="btn" data-act="modal-close">إلغاء</button></div></div></div>`;
  }
  if (S.modal === 'history') return `<div class="modal-bg" data-act="modal-close"><div class="modal" data-act="noop"><h2>سجل الإصدارات</h2><p class="note">الاسترجاع ينشئ إصدارًا جديدًا مطابقًا للقديم، فلا يضيع شيء.</p>
    <ul class="hist-list">${S.history.map(h => `<li><b>الإصدار ${h.v}</b><span class="note">${h.at} · ${esc(h.note)}</span><span class="spacer"></span>${h.v === S.published.version ? '<span class="pill">الحالي</span>' : S.versions[h.v] ? `<button class="btn" data-act="rollback:${h.v}">استرجاع</button>` : '<span class="note">—</span>'}</li>`).join('')}</ul></div></div>`;
  return '';
}

/* ======================= actions ======================= */
function snapshot() { S.undo.push(JSON.stringify(S.draft)); if (S.undo.length > 50) S.undo.shift(); S.redo = []; }
function toast(m) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }
function ptoast(m) { S.ptoast = m; S.keepScroll = true; render(); clearTimeout(S._pt); S._pt = setTimeout(() => { S.ptoast = null; S.keepScroll = true; render(); }, 2400); }
function selBlock() { return S.draft.blocks.find(x => x.id === S.selected); }
function refreshCanvas() { const c = document.getElementById('canvas'); if (c) { c.innerHTML = canvas(); afterRender(); } const top = document.querySelector('.ed-top'); if (top) { const tmp = document.createElement('div'); tmp.innerHTML = editorView(); top.replaceWith(tmp.querySelector('.ed-top')); } }
function scrollTopPhone() { const c = document.getElementById('appContent'); if (c) c.scrollTop = 0; }

const ACT = {
  'tab': v => { S.tab = v; S.modal = null; render(); window.scrollTo(0, 0); },
  'jump': v => {
    const map = {home: ['home'], plp: ['plp', {cat: 'oud'}], search: ['search'], pdp: ['pdp', {id: 1}], cart: ['cart'], account: ['account'], order: ['order', {id: S.orders[0].id}]};
    if (v === 'checkout') { if (!S.cart.length) S.cart.push({pid: 4, qty: 1, opt: '100 مل'}); S.stack = [{s: 'cart'}, {s: 'checkout'}]; render(); return; }
    if (v === 'confirm') { S.stack = [{s: 'confirm'}]; render(); return; }
    const [s, a] = map[v]; S.stack = [{s: 'home'}]; if (s !== 'home') S.stack.push({s, ...(a || {})}); S.sheet = null; render(); scrollTopPhone();
  },
  'tab-go': v => { S.sheet = null; tabGo(v === 'cats' ? 'cats' : v); },
  'nav': v => go(v),
  'back': () => back(),
  'plp': v => go('plp', {cat: v}),
  'pdp': v => go('pdp', {id: +v}),
  'order': v => go('order', {id: v}),
  'wish': v => { const id = +v; S.wish.has(id) ? S.wish.delete(id) : S.wish.add(id); S.keepScroll = true; S.tab === 'app' ? ptoast(S.wish.has(id) ? 'أُضيف إلى المفضلة' : 'أُزيل من المفضلة') : render(); },
  'notify': () => ptoast('سننبهك عند توفره (يطلب زد البريد)'),
  'ptoast': v => ptoast(v),
  'sheet': v => { S.sheet = v; S.keepScroll = true; render(); },
  'sheet-close': () => { S.sheet = null; S.keepScroll = true; render(); },
  'sort': v => { S.filters.sort = v; S.sheet = null; render(); },
  'f-price': v => { S.filters.price = S.filters.price === v || !v ? null : v; S.keepScroll = true; render(); },
  'f-fam': v => { const f = S.filters.family; f.includes(v) ? f.splice(f.indexOf(v), 1) : f.push(v); S.keepScroll = true; render(); },
  'f-clear': () => { S.filters.price = null; S.filters.family = []; S.keepScroll = true; render(); },
  'q': v => { S.q = v; render(); },
  'search-go': () => { const q = document.getElementById('q')?.value.trim(); if (q && !S.hist.includes(q)) S.hist.unshift(q); S.hist = S.hist.slice(0, 6); S.q = q || ''; render(); },
  'gal': v => { S.gal = +v; const t = document.getElementById('galTrack'); if (t) t.scrollTo({left: -t.clientWidth * +v, behavior: 'smooth'}); document.querySelectorAll('.thumbs i').forEach((el, i) => el.classList.toggle('on', i === +v)); },
  'opt': v => { S.opt = v; S.keepScroll = true; render(); },
  'pq': v => { S.qty = Math.max(1, S.qty + +v); S.keepScroll = true; render(); },
  'add': v => { const p = P(v), opt = S.opt || p.size.find(x => x !== p.oosSize); const ex = S.cart.find(c => c.pid === p.id && c.opt === opt); ex ? ex.qty += S.qty : S.cart.push({pid: p.id, qty: S.qty, opt}); ptoast('أُضيف إلى السلة ✓'); },
  'cq': v => { const [i, d] = v.split(':').map(Number); S.cart[i].qty += d; if (S.cart[i].qty < 1) S.cart.splice(i, 1); S.keepScroll = true; render(); },
  'coupon': () => { if (S.coupon) S.coupon = null; else { const c = (document.getElementById('coupon')?.value || '').trim().toUpperCase(); if (c === 'RAMADAN') S.coupon = c; else { ptoast('الكود غير صالح. جرّب RAMADAN'); return; } } S.keepScroll = true; render(); },
  'gift': () => { S.gift = !S.gift; },
  'checkout': () => go('checkout'),
  'pay': v => { S.pay = v; S.keepScroll = true; render(); },
  'pay-now': () => { const t = totals(); S.orders.unshift({id: 'ZD-' + (48200 + Math.floor(Math.random() * 90)), date: 'اليوم', total: t.total, status: 0, items: S.cart.reduce((a, c) => a + c.qty, 0)}); S.cart = []; S.coupon = null; S.pay = null; S.stack = [{s: 'confirm'}]; render(); scrollTopPhone(); },
  'push-yes': () => { S.pushAsked = true; ptoast('سنبلغك بحالة طلبك 🔔'); },
  'push-no': () => { S.pushAsked = true; S.keepScroll = true; render(); },
  'dark': () => { S.dark = !S.dark; S.keepScroll = true; render(); },
  'notes': () => { S.notes = !S.notes; S.keepScroll = true; render(); },
  'noop': () => {},
  // editor
  'edtab': v => { S.edTab = v; render(); },
  'pv': v => { S.preview = v; refreshCanvas(); },
  'select': v => { S.selected = v; S.scrollToSel = true; render(); },
  'mv': v => { const [id, d] = v.split(':'); const l = S.draft.blocks, i = l.findIndex(b => b.id === id), j = i + +d; if (j < 0 || j >= l.length) return; snapshot(); [l[i], l[j]] = [l[j], l[i]]; render(); },
  'hide': v => { snapshot(); const b = S.draft.blocks.find(x => x.id === v); b.hidden = !b.hidden; render(); },
  'del': v => { snapshot(); S.draft.blocks = S.draft.blocks.filter(x => x.id !== v); S.selected = S.draft.blocks[0]?.id; render(); toast('حُذف القسم من المسودة. يمكنك التراجع'); },
  'modal': v => { S.modal = v; render(); },
  'modal-close': () => { S.modal = null; render(); },
  'add-block': v => { snapshot(); const nb = {id: newId(), type: v, props: clone(DEFAULTS[v])}; const i = S.draft.blocks.findIndex(x => x.id === S.selected); S.draft.blocks.splice(i + 1, 0, nb); S.selected = nb.id; S.modal = null; render(); },
  'prop': v => { const [k, val] = v.split(/:(.*)/s); const b = selBlock(); snapshot(); b.props[k] = ['count', 'cols', 'hours'].includes(k) ? +val : val; render(); },
  'slide-add': () => { const b = selBlock(); snapshot(); b.props.slides.push({title: 'صورة جديدة', sub: 'نسبة 3:2 · مناسبة', hue: Math.floor(Math.random() * 360)}); render(); toast('تم اكتشاف النسبة 3:2 تلقائيًا، واقتُرح القص المناسب'); },
  'slide-del': v => { const b = selBlock(); snapshot(); b.props.slides.splice(+v, 1); render(); },
  'banner-add': () => { const b = selBlock(); snapshot(); b.props.items.push({title: 'بنر جديد', hue: Math.floor(Math.random() * 360)}); render(); },
  'preset': v => { snapshot(); S.draft.brand = {preset: v, ...clone(PRESETS[v]), darkMode: S.draft.brand.darkMode}; render(); },
  'fix-contrast': () => { snapshot(); S.draft.brand.primary = fixContrast(S.draft.brand.primary); render(); toast('عُدّل اللون إلى أقرب درجة مقروءة'); },
  'brand-radius': v => { snapshot(); S.draft.brand.radius = +v; render(); },
  'brand-card': v => { snapshot(); S.draft.brand.card = v; render(); },
  'brand-tab': v => { snapshot(); S.draft.brand.tab = v; render(); },
  'undo': () => { if (!S.undo.length) return; S.redo.push(JSON.stringify(S.draft)); S.draft = JSON.parse(S.undo.pop()); if (!S.draft.blocks.find(b => b.id === S.selected)) S.selected = S.draft.blocks[0]?.id; render(); },
  'redo': () => { if (!S.redo.length) return; S.undo.push(JSON.stringify(S.draft)); S.draft = JSON.parse(S.redo.pop()); render(); },
  'publish': () => { const d = diff(); const v = S.published.version + 1; S.published = {version: v, blocks: clone(S.draft.blocks), brand: clone(S.draft.brand), at: 'الآن'}; S.versions[v] = clone(S.published); S.history.unshift({v, at: 'الآن', note: d.slice(0, 2).map(x => x[2]).join('، ') || 'تعديلات'}); S.modal = null; render(); toast(`نُشر الإصدار ${v}. افتح «تطبيق المتسوق» لترى التغيير`); },
  'rollback': v => { const old = S.versions[+v]; if (!old) return; const nv = S.published.version + 1; S.published = {version: nv, blocks: clone(old.blocks), brand: clone(old.brand), at: 'الآن'}; S.versions[nv] = clone(S.published); S.draft = {blocks: clone(old.blocks), brand: clone(old.brand)}; S.history.unshift({v: nv, at: 'الآن', note: `استرجاع الإصدار ${v}`}); S.modal = null; render(); toast(`أُنشئ الإصدار ${nv} مطابقًا للإصدار ${v}`); },
};
document.addEventListener('click', e => {
  const edPhone = e.target.closest('[data-phone="editor"]');
  if (edPhone) { e.preventDefault(); const sel = e.target.closest('[data-act^="select:"]'); if (sel) ACT.select(sel.dataset.act.slice(7)); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; const i = a.indexOf(':'); const k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  if (el.matches('input[type=checkbox]') && !['dark', 'notes', 'gift'].includes(k)) return;
  if (k === 'noop') { e.stopPropagation(); return; }
  if (['sheet-close', 'modal-close'].includes(k) && e.target !== el && !e.target.closest('button')) return;
  if (el.tagName === 'A') return;
  e.stopPropagation();
  (ACT[k] || (() => {}))(v);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q') ACT['search-go']();
  if (e.key === 'Escape' && (S.modal || S.sheet)) { S.modal = null; S.sheet = null; render(); }
  const li = e.target.closest?.('.outline li'); if (li && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); ACT.mv(li.dataset.id + ':' + (e.key === 'ArrowUp' ? -1 : 1)); document.querySelector(`.outline li[data-id="${li.dataset.id}"]`)?.focus(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; const r = document.getElementById('searchRes'); const ctx = {dark: S.dark, t: tokens(S.published.brand, S.dark)}; const norm = x => x.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); const q = S.q.trim(); if (r) r.innerHTML = searchResults(q, q ? PRODUCTS.filter(p => norm(p.name).includes(norm(q))) : [], ctx); return; }
  const b = selBlock();
  if (t.dataset.prop && b && t.type !== 'checkbox') { b.props[t.dataset.prop] = t.value; refreshCanvas(); return; }
  if (t.dataset.slide !== undefined && b) { b.props.slides[+t.dataset.slide].title = t.value; refreshCanvas(); return; }
  if (t.dataset.item !== undefined && b) { b.props.items[+t.dataset.item].title = t.value; refreshCanvas(); return; }
  if (t.dataset.brand) { const k = t.dataset.brand; if (k === 'primary' && !/^#[0-9a-f]{6}$/i.test(t.value)) return; S.draft.brand[k] = t.value; refreshCanvas(); document.querySelectorAll(`[data-brand="${k}"]`).forEach(x => { if (x !== t) x.value = t.value; }); return; }
});
document.addEventListener('change', e => {
  const t = e.target, b = selBlock();
  if (t.dataset.prop && b) { if (t.type === 'checkbox') { snapshot(); b.props[t.dataset.prop] = t.checked; } else if (t.tagName === 'SELECT') { snapshot(); b.props[t.dataset.prop] = t.value; } render(); return; }
  if (t.dataset.slide !== undefined || t.dataset.item !== undefined) { render(); return; }
  if (t.dataset.brand) { render(); }
});
document.addEventListener('focusin', e => { if (e.target.matches('[data-prop],[data-slide],[data-item],[data-brand]') && S.tab === 'editor') snapshot(); });

/* drag & drop in outline */
let dragId = null;
document.addEventListener('dragstart', e => { const li = e.target.closest?.('.outline li'); if (li) { dragId = li.dataset.id; e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const li = e.target.closest?.('.outline li'); if (li && dragId) { e.preventDefault(); document.querySelectorAll('.outline li').forEach(x => x.classList.toggle('drag-over', x === li)); } });
document.addEventListener('drop', e => { const li = e.target.closest?.('.outline li'); if (!li || !dragId) return; e.preventDefault(); const l = S.draft.blocks, from = l.findIndex(b => b.id === dragId), to = l.findIndex(b => b.id === li.dataset.id); if (from !== to) { snapshot(); const [m] = l.splice(from, 1); l.splice(to, 0, m); } dragId = null; render(); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); });

/* timers & sliders */
function afterRender() {
  const ec = document.querySelector('[data-phone="editor"] .content'), sb = ec?.querySelector('.block.sel');
  if (ec && sb && S.scrollToSel) { ec.scrollTop = Math.max(0, sb.offsetTop - 60); }
  S.scrollToSel = false;
  document.querySelectorAll('.outline li').forEach(li => li.tabIndex = 0);
  document.querySelectorAll('[data-slider]').forEach(el => el.addEventListener('scroll', () => {
    const i = Math.round(Math.abs(el.scrollLeft) / el.clientWidth); const id = el.dataset.slider; if (S.slide[id] !== i) { S.slide[id] = i; el.nextElementSibling?.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i)); }
  }, {passive: true}));
  const g = document.getElementById('galTrack'); if (g) g.addEventListener('scroll', () => { const i = Math.round(Math.abs(g.scrollLeft) / g.clientWidth); document.querySelectorAll('.thumbs i').forEach((el, k) => el.classList.toggle('on', k === i)); S.gal = i; }, {passive: true});
  tick();
}
const START = Date.now();
function tick() {
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const left = Math.max(0, +el.dataset.countdown * 3600 - Math.floor((Date.now() - START) / 1000));
    const h = String(Math.floor(left / 3600)).padStart(2, '0'), m = String(Math.floor(left % 3600 / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0');
    el.textContent = `${h}:${m}:${s}`;
  });
}
setInterval(tick, 1000);
setInterval(() => {
  document.querySelectorAll('[data-phone="app"] [data-slider]').forEach(el => {
    const b = S.published.blocks.find(x => x.id === el.dataset.slider); if (!b || !b.props.autoplay || el.matches(':hover')) return;
    const n = b.props.slides.length; if (n < 2) return; const i = ((S.slide[b.id] || 0) + 1) % n; el.scrollTo({left: -el.clientWidth * i, behavior: 'smooth'});
  });
}, 4000);

render();
</script>
