# Builds the Intishar portal (VitePress) and publishes it to GitHub Pages.
# The progress page reads Issues and Milestones at build time, so the site is
# rebuilt on every push, on every issue change, and hourly.
name: Portal

on:
  push:
    branches: [master]
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled, milestoned, demilestoned]
  milestone:
    types: [created, edited, closed, opened, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTAL_REPO: ${{ github.repository }}
          PORTAL_BASE: /${{ github.event.repository.name }}/
        run: npx vitepress build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
